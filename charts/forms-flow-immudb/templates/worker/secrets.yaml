{{- if and .Values.worker.enabled (not .Values.worker.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forms-flow-immudb.worker.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-immudb.worker.labels" . | nindent 4 }}
  {{- if or .Values.worker.secretAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.worker.secretAnnotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  secret-key: {{ .Values.worker.auth.secretKey | default "change-me-in-production-use-strong-random-key" | quote }}
  immudb-pass: {{ .Values.worker.auth.immudbPassword | default "immudb" | quote }}
  immudb-secret-key: {{ .Values.worker.auth.immudbSecretKey | default "1Ipjwuf3k3Mj-QI97iGhZMsJx2lxXzIWT6afdg9f-l0=" | quote }}
{{- end }}
