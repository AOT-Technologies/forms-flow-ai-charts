{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forms-flow-immudb.worker.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-immudb.worker.labels" . | nindent 4 }}
  {{- if or .Values.worker.deploymentAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.worker.deploymentAnnotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  selector:
    matchLabels: {{- include "forms-flow-immudb.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "forms-flow-immudb.worker.labels" . | nindent 8 }}
      {{- if or .Values.worker.podAnnotations .Values.commonAnnotations }}
      {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.worker.podAnnotations .Values.commonAnnotations ) "context" . ) }}
      annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      {{- include "forms-flow-immudb.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "forms-flow-immudb.serviceAccountName" . }}
      {{- if .Values.worker.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.worker.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml .Values.worker.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      tolerations: {{- toYaml .Values.worker.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.affinity }}
      affinity: {{- toYaml .Values.worker.affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: forms-flow-immudb
          image: {{ include "forms-flow-immudb.worker.image" . }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | quote }}
          {{- if .Values.worker.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.worker.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.worker.service.targetPort | default 5001 }}
              name: {{ .Values.worker.service.portName | default "http" }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.worker.service.targetPort | default 5001 | quote }}
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: DEBUG
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: FLASK_ENV
            - name: IMMUDB_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: IMMUDB_ENABLED
            - name: IMMUDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: IMMUDB_HOST
            - name: IMMUDB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: IMMUDB_USER
            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: API_PREFIX
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: CORS_ORIGINS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: LOG_LEVEL
            - name: GUNICORN_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: GUNICORN_WORKERS
            - name: GUNICORN_THREADS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: GUNICORN_THREADS
            - name: GUNICORN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "forms-flow-immudb.worker.configMapName" . }}
                  key: GUNICORN_TIMEOUT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "forms-flow-immudb.worker.secretName" . }}
                  key: secret-key
            - name: IMMUDB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "forms-flow-immudb.worker.secretName" . }}
                  key: immudb-pass
            - name: IMMUDB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "forms-flow-immudb.worker.secretName" . }}
                  key: immudb-secret-key
            {{- if .Values.worker.extraEnvVars }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.worker.extraEnvVars "context" $ ) | nindent 12 }}
            {{- end }}
          {{- if or .Values.worker.extraEnvVarsCM .Values.worker.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.worker.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" ( dict "value" .Values.worker.extraEnvVarsCM "context" $ ) }}
            {{- end }}
            {{- if .Values.worker.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" ( dict "value" .Values.worker.extraEnvVarsSecret "context" $ ) }}
            {{- end }}
          {{- end }}
          {{- if .Values.worker.resources }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- else if and .Values.worker.resourcesPreset (ne .Values.worker.resourcesPreset "none") }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.worker.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.worker.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.worker.livenessProbe.enabled }}
          livenessProbe:
            initialDelaySeconds: {{ .Values.worker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.worker.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.worker.livenessProbe.failureThreshold }}
            httpGet:
              path: /health
              port: {{ .Values.worker.service.targetPort | default 5001 }}
          {{- end }}
          {{- if .Values.worker.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.worker.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.worker.readinessProbe.enabled }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.worker.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.worker.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.worker.readinessProbe.failureThreshold }}
            httpGet:
              path: /health
              port: {{ .Values.worker.service.targetPort | default 5001 }}
          {{- end }}
          volumeMounts:
            - name: logs
              mountPath: /forms-flow-immudb/app/logs
            {{- if .Values.worker.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.worker.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if .Values.worker.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.worker.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- end }}
