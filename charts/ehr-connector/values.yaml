  ## @param auth.existingSecret Existing secret containing epic-client-id, epic-kid, epic-private-key
  existingSecret: ""

## @section Service parameters
service:
  ## @param service.type Kubernetes service type
  type: ClusterIP
  ## @param service.port Service port
  port: 8002
  ## @param service.targetPort Target port on the container
  targetPort: 8002
  ## @param service.portName Service port name
  portName: api
  ## @param service.nameOverride Override the service name
  nameOverride: ""
  ## @param service.annotations Service annotations
  annotations: {}

## @section Ingress parameters
ingress:
  ## @param ingress.enabled Enable ingress record generation
  enabled: true
  ## @param ingress.ingressClassName IngressClass that will be used to implement the Ingress
  ingressClassName: "nginx"
  ## @param ingress.hostname Ingress hostname
  hostname: "fhir-epic.aot-technologies.com"
  ## @param ingress.path Ingress path
  path: "/epic/.*"
  ## @param ingress.pathType Ingress path type
  pathType: "Prefix"
  ## @param ingress.annotations Ingress annotations
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
  ## @param ingress.tls Enable TLS configuration
  tls: false
  ## @param ingress.tlsSecretName Custom TLS secret name
  tlsSecretName: ""
  ## @param ingress.extraPaths Extra paths to include in the ingress
  extraPaths: []
  ## @param ingress.extraHosts Extra hosts to include in the ingress
  extraHosts: []
  ## @param ingress.extraRules Extra rules to include in the ingress
  extraRules: []

## @section Persistence parameters
persistence:
  ## @param persistence.enabled Enable persistent volume claim template
  enabled: true
  ## @param persistence.mountPath Data directory mount path in container
  mountPath: "/forms-flow-ehr-connectors/app/data"
  ## @param persistence.storageClass Storage class name (e.g. gp2)
  storageClass: "gp2"
  ## @param persistence.accessModes PVC Access Modes
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size PVC size
  size: "1Gi"
  ## @param persistence.annotations PVC annotations
  annotations: {}

## @section Resources parameters
resourcesPreset: "none"
## @param resources Container requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

## @section Probes parameters
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

## @param customLivenessProbe Custom liveness probe
customLivenessProbe: {}
## @param customReadinessProbe Custom readiness probe
customReadinessProbe: {}

## @section Autoscaling parameters
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 80
  targetMemory: 80

## @section Pod Disruption Budget
pdb:
  create: false
  minAvailable: ""
  maxUnavailable: 1

## @section Diagnostics & Overrides
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

command: []
args: []

extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
statefulsetAnnotations: {}
secretAnnotations: {}
configMapAnnotations: {}
