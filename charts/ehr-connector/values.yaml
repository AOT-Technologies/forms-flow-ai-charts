## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
##

## @param replicaCount Number of ehr-connector replicas
replicaCount: 1

## @section ehr-connector Image parameters
image:
  ## @param image.registry ehr-connector image registry
  registry: docker.io
  ## @param image.repository ehr-connector image repository
  repository: formsflow/forms-flow-ehr-connectors
  ## @param image.pullPolicy ehr-connector image pull policy
  pullPolicy: Always
  ## @param image.tag ehr-connector image tag (immutable tags are recommended)
  tag: "v8.1.0.20260810105148"
  ## @param image.pullSecrets Specify docker-registry secret names as an array
  pullSecrets: []

## @param nameOverride String to partially override common.names.fullname
nameOverride: ""

## @param fullnameOverride String to fully override common.names.fullname
fullnameOverride: ""

## @param commonLabels Labels to add to all deployed objects
commonLabels: {}

## @param commonAnnotations Annotations to add to all deployed objects
commonAnnotations: {}

## @section Service Account parameters
serviceAccount:
  ## @param serviceAccount.create Specifies whether a service account should be created
  create: true
  ## @param serviceAccount.name The name of the service account to use
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Automount service account token
  automountServiceAccountToken: false
  ## @param serviceAccount.annotations Annotations for service account
  annotations: {}

## @section Security Context parameters
podSecurityContext:
  ## @param podSecurityContext.enabled Enable pod security context
  enabled: false
  fsGroup: 1001

containerSecurityContext:
  ## @param containerSecurityContext.enabled Enable container security context
  enabled: false
  runAsUser: 1001
  runAsNonRoot: false

## @section Application Configuration parameters
config:
  ## @param config.serviceType Service type configuration
  serviceType: "connector"
  ## @param config.logLevel Logging verbosity (debug, info, warning, error)
  logLevel: "info"

